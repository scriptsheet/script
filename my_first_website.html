<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> Hi, this is my first website!! </h1>
    <input id="words" placeholder="Your Text Here">
    <p> It will copy! </p>
    <p id="copyarea">  </p>
    <script>
      let input = document.getElementById("words");
      function game_loop() {
        document.getElementById("copyarea").innerHTML = input.value
      }
      setInterval(game_loop, 16)
    </script>
</body>
</html>
